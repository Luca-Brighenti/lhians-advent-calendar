<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lhian's Advent Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="banner">
    <div class="banner-inner">
      <div class="ribbon-top"></div>
      <h1 class="title">Lhian's</h1>
      <p class="subtitle">Christmas Advent Calendar</p>
      <div class="ribbon-bottom"></div>
    </div>
  </header>

  <main>
    <div id="calendar" class="calendar-grid" aria-label="Advent calendar">
      <!-- Days 10-25 -->
      <button class="day-box red" data-day="10" aria-label="Open day 10">10</button>
      <button class="day-box green" data-day="11" aria-label="Open day 11">11</button>
      <button class="day-box red" data-day="12" aria-label="Open day 12">12</button>
      <button class="day-box green" data-day="13" aria-label="Open day 13">13</button>
      <button class="day-box green" data-day="14" aria-label="Open day 14">14</button>
      <button class="day-box red" data-day="15" aria-label="Open day 15">15</button>
      <button class="day-box green" data-day="16" aria-label="Open day 16">16</button>
      <button class="day-box red" data-day="17" aria-label="Open day 17">17</button>
      <button class="day-box red" data-day="18" aria-label="Open day 18">18</button>
      <button class="day-box green" data-day="19" aria-label="Open day 19">19</button>
      <button class="day-box red" data-day="20" aria-label="Open day 20">20</button>
      <button class="day-box green" data-day="21" aria-label="Open day 21">21</button>
      <button class="day-box green" data-day="22" aria-label="Open day 22">22</button>
      <button class="day-box red" data-day="23" aria-label="Open day 23">23</button>
      <button class="day-box green" data-day="24" aria-label="Open day 24">24</button>
      <button class="day-box red" data-day="25" aria-label="Open day 25">25</button>
    </div>
  </main>

  <!-- Popup Modal (starts hidden) -->
  <div id="popup" class="hidden" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-content">
      <h2 id="popup-title">🎄 Merry Christmas!</h2>
      <div class="question-wrap">
        <img src="assets/question.png" alt="Limit question" class="question-img"/>
        <form id="answer-form" class="answer-form">
          <label for="answer-input" class="answer-label">Answer:</label>
          <input id="answer-input" class="answer-input" type="text" placeholder="PUT ANSWER HERE" autocomplete="off"/>
          <button id="submit-answer" class="submit-btn" type="submit">Submit</button>
        </form>
        <div id="answer-feedback" class="answer-feedback" aria-live="polite"></div>
      </div>
      <button id="close-btn" class="close-btn" aria-label="Close popup" type="button">Close</button>
    </div>
  </div>

  <!-- Background Music + Toggle -->
  <audio id="bg-music" src="assets/background-music.mp3" loop></audio>
  <audio id="trumpetSfx" src="assets/queen-royalty-trumpet.mp3" preload="auto"></audio>
  <button id="mute-btn" class="mute-btn" aria-label="Toggle background music" type="button">🔇</button>
  <button id="reset-btn" class="reset-btn" type="button" title="Reset opened chests">
  ↺ Reset
</button>

  <footer class="footer">
    <p>© <span id="year"></span> Lhian’s Advent Calendar</p>
  </footer>

  <script src="config.js?v=1" defer></script>
<script src="js/script.js"></script>
</body>
</html>
